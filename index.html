<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>קוראים באנגלית</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column. The passage is the biggest thing on screen, the microphone button sits right under it, everything for the parent is tucked at the bottom. */
:root {
  --bg: #f1f6fb; --surface: #ffffff; --ink: #16263a; --muted: #5a6b80; --line: #d3deea;
  --accent: #2457d6; --accent-ink: #ffffff; --sun: #f5b921;
  --good: #0f7a56; --good-bg: #dcf4e8; --miss: #bf3327; --miss-bg: #fde4e0;
  --ui: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --read: "Lexend", "Verdana", "Trebuchet MS", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1725; --surface: #172338; --ink: #e8eef6; --muted: #9aabc0; --line: #2a3a53;
    --accent: #86a9ff; --accent-ink: #0b1424; --sun: #ffd15c;
    --good: #62d6a7; --good-bg: #123a2c; --miss: #ff9186; --miss-bg: #47211d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5; }
.app {
  max-width: 760px; margin: 0 auto;
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font-size: .8rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 10px; }

.sentence {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 26px 18px; min-height: 150px;
  display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 10px 4px;
  font-family: var(--read); font-size: clamp(1.4rem, 4.8vw, 2.1rem); font-weight: 500; line-height: 1.3;
}
.sentence.live { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.w {
  font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 3px solid transparent;
  border-radius: 10px; padding: 2px 8px; cursor: pointer; min-width: 0; overflow-wrap: anywhere;
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.w.ok { background: var(--good-bg); color: var(--good); }
.w.miss { background: var(--miss-bg); color: var(--miss); border-bottom-color: var(--miss); }
.w.say { outline: 3px solid var(--sun); outline-offset: 1px; }
.w.next { background: color-mix(in srgb, var(--accent) 12%, transparent); border-bottom-color: var(--accent); }
.w .he {
  font-family: var(--ui); font-weight: 400; font-size: clamp(.9rem, .5em, 1.15rem); line-height: 1.6;
  color: var(--muted); min-height: 1.6em; white-space: nowrap;
}
.hintrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 18px; color: var(--muted); font-size: .9rem; margin-top: -8px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggle input { width: 1.05em; height: 1.05em; accent-color: var(--accent); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
button { font-family: var(--ui); touch-action: manipulation; }
.btn {
  font-size: 1rem; font-weight: 500; border-radius: 999px; padding: 12px 20px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 1.15rem; font-weight: 700; padding: 14px 28px; }
.btn.primary.live { background: var(--miss); border-color: var(--miss); color: var(--surface); animation: pulse 1.4s ease-in-out infinite; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--miss) 22%, transparent); } }
@media (prefers-reduced-motion: reduce) { .btn.primary.live { animation: none; } }

.feedback { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.feedback .big { font-size: 1.3rem; font-weight: 700; }
.stars { font-size: 1.7rem; letter-spacing: 4px; color: var(--line); }
.stars b { color: var(--sun); font-weight: 400; }
.heard { font-family: var(--read); color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.note { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 16px; color: var(--muted); font-size: .95rem; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; flex: 1; min-width: 0; }
.dot { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.dot.cur { border-color: var(--accent); }
.dot.s1, .dot.s2 { background: var(--sun); border-color: var(--sun); opacity: .55; }
.dot.s3 { background: var(--good); border-color: var(--good); }
.dot.cur.s1, .dot.cur.s2, .dot.cur.s3 { outline: 2px solid var(--accent); outline-offset: 2px; }

details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 500; color: var(--muted); }
.editor { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.editor p { margin: 0; color: var(--muted); font-size: .92rem; }
textarea {
  width: 100%; min-height: 190px; resize: vertical; font-family: var(--read); font-size: 1rem; line-height: 1.6;
  padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
#saveStatus { color: var(--muted); font-size: .92rem; }

#practice { display: flex; flex-direction: column; gap: 18px; }
.btn.small { padding: 6px 14px; font-size: .92rem; }
.btn.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.hintline { margin: 0; color: var(--muted); font-size: .92rem; }
.chooser { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
.chooser h2 { margin: 0; font-size: 1.25rem; }
.chooser .btn.name { font-size: 1.15rem; font-weight: 700; padding: 14px 26px; }
input[type="text"] {
  font-family: var(--ui); font-size: 1rem; padding: 11px 14px; border-radius: 12px; min-width: 0; flex: 1 1 160px; max-width: 260px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.report { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.report h3 { margin: 0; font-size: 1rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: .88rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: start; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: .88rem; }
.pass { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.pass .en { font-family: var(--read); overflow-wrap: anywhere; }
.pass .meta { color: var(--muted); font-size: .9rem; }
.pass .bad { color: var(--miss); font-size: .92rem; }
.pass .bad bdi, .chip { font-family: var(--read); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: .95rem; cursor: pointer; }
.chip small { color: var(--miss); font-family: var(--ui); }
.danger { color: var(--miss); border-color: color-mix(in srgb, var(--miss) 45%, var(--line)); }
#importBox { display: flex; flex-direction: column; gap: 10px; border-style: solid; border-color: var(--accent); }
#importBox .en { margin: 0; font-family: var(--read); color: var(--ink); overflow-wrap: anywhere; }
.srcbar { justify-content: center; gap: 8px; }
#srcHint { text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>קוראים באנגלית</h1>
    <span class="row"><span class="badge" id="localBadge" hidden>קטעים שנשמרו במכשיר הזה</span> <span class="count" id="count"></span>
      <button class="btn small" id="whoBtn" type="button" hidden></button></span>
  </header>

  <div class="note" id="importBox" hidden>
    <p class="hintline" id="importText"></p>
    <p class="en" id="importFirst" dir="ltr" lang="en"></p>
    <div class="row">
      <button class="btn" id="importYes" type="button">טעינת הקטעים</button>
      <button class="btn" id="importNo" type="button">ביטול</button>
    </div>
  </div>

  <section class="chooser" id="chooser" hidden>
    <h2>מי קוראת עכשיו?</h2>
    <div class="row" id="profileList"></div>
    <div class="row">
      <input type="text" id="newName" maxlength="20" placeholder="שם של ילדה חדשה" autocomplete="off">
      <button class="btn" id="addProfile" type="button">הוספה</button>
    </div>
    <p class="hintline">השמות והדוחות נשמרים רק במכשיר הזה.</p>
  </section>

  <div id="practice">
  <div class="row srcbar" id="sources"></div>
  <p class="hintline" id="srcHint" hidden></p>
  <div class="sentence" id="sentence" dir="ltr" lang="en"></div>
  <div class="hintrow">
    <span id="wordHint">לחיצה על מילה משמיעה אותה</span>
    <label class="toggle" id="glossWrap" hidden><input type="checkbox" id="glossToggle" checked> הגייה בעברית</label>
  </div>

  <div class="actions">
    <button class="btn" id="listenBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span id="listenLabel">השמיעי לי</span>
    </button>
    <button class="btn" id="slowBtn" type="button">מילה מילה</button>
    <button class="btn primary" id="micBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="micLabel">התחילי לקרוא</span>
    </button>
    <button class="btn" id="finishBtn" type="button" hidden>סיימתי</button>
  </div>

  <div class="note" id="envNote" hidden></div>
  <div class="note" id="micNote" hidden></div>

  <div class="feedback" id="feedback" hidden>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="big" id="fbTitle"></div>
    <div id="fbText"></div>
    <div class="heard" id="heard" dir="ltr" lang="en"></div>
  </div>

  <div class="nav">
    <button class="btn" id="prevBtn" type="button">הקודם</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="nextBtn" type="button">הבא</button>
  </div>
  </div>

  <details id="reportBox">
    <summary>להורים: דוח קריאה</summary>
    <div class="report" id="report"></div>
  </details>

  <details id="parent">
    <summary>להורים: קטעים אחרים</summary>
    <div class="editor">
      <p>אפשר להקליד או להדביק כאן קטעים אחרים, קטע בכל שורה. הם נשמרים רק במכשיר הזה. הגייה בעברית מגיעה רק עם קטעים שנטענו מקישור.</p>
      <textarea id="editor" dir="ltr" lang="en" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn" id="saveBtn" type="button">שמירה</button>
        <button class="btn" id="resetBtn" type="button" hidden>חזרה לקטעים המקוריים</button>
        <span id="saveStatus" role="status"></span>
      </div>
    </div>
  </details>
</div>

<script>
(function () {
  "use strict";
  var LS_LOCAL = "reading-ipad-local", LS_GLOSS = "reading-ipad-show-hebrew", LS_IDX = "reading-ipad-index";
  var PASSAGE_RATE = 0.7, WORD_RATE = 0.6;
  var $ = function (id) { return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var hasSynth = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);

  // <core>
  // Words that sound the same count as the same word: speech-to-text cannot tell them apart.
  var GROUPS = [
    ["to","too","two","2"],["there","their","theyre"],["for","four","4"],["see","sea"],["no","know"],
    ["right","write"],["here","hear"],["by","buy","bye"],["sun","son"],["one","won","1"],["your","youre"],
    ["ate","eight","8"],["be","bee"],["i","eye"],["new","knew"],["red","read"],["meet","meat"],["hi","high"],
    ["our","hour"],["wear","where"],["ok","okay"],["mum","mom"],["three","3"],["five","5"],["six","6"],
    ["seven","7"],["nine","9"],["ten","10"],["zero","0"],["eleven","11"],["twelve","12"],["whole","hole"],
    ["week","weak"],["blue","blew"],["flower","flour"],["tail","tale"],["wood","would"],["grey","gray"],
    ["colour","color"],["favourite","favorite"],["cannot","cant"]
  ];
  var CANON = {};
  GROUPS.forEach(function (g) { g.forEach(function (w) { CANON[w] = g[0]; }); });

  function norm(word) {
    var w = word.toLowerCase().replace(/[’'`]/g, "").replace(/[^a-z0-9]/g, "");
    return CANON[w] || w;
  }
  function tokens(text) {
    return text.split(/\s+/).filter(Boolean).map(function (raw) { return { raw: raw, key: norm(raw) }; });
  }
  // Reading in order. Only the word at the cursor can be matched. A heard word that
  // appears later in the text never moves the cursor forward. The one exception:
  // when the words that FOLLOW the cursor are then read correctly, the cursor word
  // is marked as missed and reading carries on.
  function walk(base, s, t) {
    var c = base.cursor, missed = {}, j = 0, n = t.length, m = s.length, k, need, sub;
    for (k in base.missed) { missed[k] = true; }
    while (j < m && c < n) {
      if (s[j] === t[c]) { c++; j++; continue; }
      need = Math.min(2, n - 1 - c);
      if (need >= 1) {
        sub = true;
        for (k = 1; k <= need; k++) { if (s[j + k] !== t[c + k]) { sub = false; } }
        if (sub) { missed[c] = true; c++; j++; continue; }       // said a different word instead
      }
      if (c + 2 < n && s[j] === t[c + 1] && s[j + 1] === t[c + 2]) { missed[c] = true; c++; continue; } // left the word out
      j++;                                                       // noise or a repeat: ignore
    }
    return { cursor: c, missed: missed };
  }
  // </core>

  // ---------- state ----------
  var teacher = { sentences: [], glosses: [], updatedAt: "" };
  var sentences = [], glosses = [], isLocal = false;
  var idx = 0, stars = {}, toks = [];
  var attempt = null;                 // { text, helped } while a reading is under way
  var rec = null, sesFinal = "", sesInterim = "", gotText = false, lastErr = "", idleRestarts = 0;
  var listening = false, pendingWord = null, verdict = null, wantFinish = false, showHe = true;
  var talking = false, sayingTok = -1, synthRun = 0;
  // Who is reading, and what each girl has read. Kept on this device only: nothing here is ever sent anywhere.
  var LS_PROF = "reading-ipad-profiles", LS_CUR = "reading-ipad-current", LS_LOG = "reading-ipad-log-";
  var profiles = [], me = null, log = [], listenT0 = 0;
  var bank = null, source = "teacher", wantSrc = "teacher", LS_SRC = "reading-ipad-source";

  function readLog(id) {
    try { var l = JSON.parse(localStorage.getItem(LS_LOG + id) || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; }
  }
  function writeLog() {
    if (log.length > 600) { log = log.slice(-600); }
    try { localStorage.setItem(LS_LOG + me.id, JSON.stringify(log)); } catch (e) { /* storage blocked or full */ }
  }
  function saveProfiles() {
    try {
      localStorage.setItem(LS_PROF, JSON.stringify(profiles));
      if (me) { localStorage.setItem(LS_CUR, me.id); } else { localStorage.removeItem(LS_CUR); }
    } catch (e) { /* storage blocked */ }
  }
  function bestStars() {
    var out = {};
    log.forEach(function (r) { var i = sentences.indexOf(r.s); if (i >= 0 && r.st > (out[i] || 0)) { out[i] = r.st; } });
    return out;
  }
  function clean(raw) { return raw.replace(/[^A-Za-z0-9'’-]/g, "").toLowerCase(); }
  function tick() {      // time spent with the microphone open counts as reading time
    if (listenT0 && attempt) { attempt.ms = (attempt.ms || 0) + Math.min(Date.now() - listenT0, 300000); }
    listenT0 = 0;
  }
  function record(a, r, st) {
    if (!me) { return; }
    var real = toks.filter(function (t) { return t.key; }), n = real.length;
    var wordsAt = function (map) {
      return Object.keys(map).map(function (k) { return real[k]; }).filter(Boolean).map(function (t) { return clean(t.raw); });
    };
    var done = r.cursor >= n;
    log.push({
      t: Date.now(), s: (sentences[idx] || "").slice(0, 300), n: n,
      good: r.cursor - Object.keys(r.missed).length, miss: wordsAt(r.missed),
      stuck: done || !real[r.cursor] ? "" : clean(real[r.cursor].raw), help: wordsAt(a.helped),
      ms: Math.round(a.ms || 0), st: st, done: done
    });
    writeLog();
  }
  // A try that is left in the middle (another passage, another girl) still counts in the report.
  function abandon() {
    if (!attempt) { return; }
    tick();
    var r = progress(), n = realKeys().length || 1;
    if ((attempt.text + sesFinal + sesInterim).trim() && r.cursor > 0) {
      var ratio = (r.cursor - Object.keys(r.missed).length) / n;
      record(attempt, r, ratio === 1 ? 3 : ratio >= 0.75 ? 2 : ratio >= 0.4 ? 1 : 0);
    }
    attempt = null;
  }

  function hasGloss(g) { return Array.isArray(g) && g.some(Boolean); }
  function use(list, gl, local) {
    abandon();
    sentences = list; glosses = gl || []; isLocal = local; stars = bestStars();
    if (idx >= sentences.length) { idx = 0; }
    attempt = null; verdict = null; pendingWord = null; render();
  }
  function realKeys() { return toks.filter(function (t) { return t.key; }).map(function (t) { return t.key; }); }
  function progress() {
    var said = tokens(attempt.text + " " + sesFinal + " " + sesInterim).map(function (t) { return t.key; }).filter(Boolean);
    return walk({ cursor: 0, missed: {} }, said, realKeys());
  }

  // ---------- rendering ----------
  function render() {
    toks = tokens(sentences[idx] || "");
    $("count").textContent = sentences.length ? "קטע " + (idx + 1) + " מתוך " + sentences.length : "";
    $("localBadge").hidden = !isLocal;
    $("whoBtn").hidden = !me; $("whoBtn").textContent = me ? me.name + " ▾" : "";
    drawSources();
    $("prevBtn").disabled = idx === 0 || listening;
    $("nextBtn").disabled = idx >= sentences.length - 1 || listening;

    var g = glosses[idx], useHe = showHe && hasGloss(g);
    $("glossWrap").hidden = !glosses.some(hasGloss);
    var now = attempt ? progress() : null, k = 0;
    var box = $("sentence"); box.textContent = "";
    box.classList.toggle("live", listening);
    toks.forEach(function (t, ti) {
      var b = document.createElement("button"), mine = -1;
      b.type = "button"; b.className = "w" + (ti === sayingTok ? " say" : "");
      var en = document.createElement("span"); en.textContent = t.raw; b.appendChild(en);
      if (useHe) {
        var he = document.createElement("span"); he.className = "he"; he.dir = "rtl"; he.lang = "he";
        he.textContent = (t.key && g[ti]) || " "; b.appendChild(he);
      }
      if (t.key) {
        mine = k++;
        if (now) {
          if (mine < now.cursor) { b.classList.add(now.missed[mine] ? "miss" : "ok"); }
          else if (mine === now.cursor) { b.classList.add("next"); }
        } else if (verdict) { b.classList.add(verdict.miss[mine] ? "miss" : "ok"); }
      }
      b.addEventListener("click", function () {
        wordTap(mine, t.raw.replace(/[^A-Za-z0-9'’-]/g, "") || t.raw);
      });
      box.appendChild(b);
    });

    var dots = $("dots"); dots.textContent = "";
    sentences.forEach(function (_, i) {
      var d = document.createElement("button");
      d.type = "button"; d.className = "dot" + (i === idx ? " cur" : "") + (stars[i] ? " s" + stars[i] : "");

        o.words.forEach(function (x) {
          var c = el("button", "chip", x.w + " "); c.appendChild(el("small", "", "×" + x.c));
          c.addEventListener("click", function () { if (!listening) { speak(x.w, WORD_RATE); } });
          chips.appendChild(c);
        });
        box.appendChild(chips);
      }

      if (repDays !== 1 && o.days.length > 1) {
        box.appendChild(el("h3", "", "לפי ימים"));
        var wrap = el("div", "scroll"), tb = el("table"), hr = el("tr");
        ["יום", "זמן", "קטעים", "דיוק"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
        tb.appendChild(hr);
        o.days.forEach(function (d) {
          var tr = el("tr");
          [dayLabel(d.t), fmt(d.ms), String(d.tries), pct(d.good, d.tried)].forEach(function (v) { tr.appendChild(el("td", "", v)); });
          tb.appendChild(tr);
        });
        wrap.appendChild(tb); box.appendChild(wrap);
      }

      box.appendChild(el("h3", "", "לפי קטעים"));
      o.pass.forEach(function (p) {
        var card = el("div", "pass"), en = el("div", "en", p.s); en.dir = "ltr"; en.lang = "en";
        card.appendChild(en);
        card.appendChild(el("div", "meta", p.tries + (p.tries === 1 ? " ניסיון" : " ניסיונות") + " · הכי טוב " + "★".repeat(p.best) + "☆".repeat(3 - p.best) +
          " · בפעם האחרונה " + p.last.good + " מתוך " + p.last.n + (p.last.done ? "" : ", לא עד הסוף")));
        var h = hard(p.last);
        if (h.length) {
          var bad = el("div", "bad", "התקשתה ב: "), b = el("bdi", "", h.join(", ")); b.dir = "ltr";
          bad.appendChild(b); card.appendChild(bad);
        }
        box.appendChild(card);
      });

      var copy = el("button", "btn small", "העתקת הדוח"), text = reportText(child.name, label, o);
      copy.addEventListener("click", function () {
        var ok = function () { copy.textContent = "הועתק"; }, no = function () { copy.textContent = "לא הצלחתי להעתיק"; };
        try { navigator.clipboard.writeText(text).then(ok, no); } catch (e) { no(); }
      });
      var crow = el("div", "row"); crow.appendChild(copy); box.appendChild(crow);
    }

    var del = el("button", "btn small danger", "מחיקת " + child.name + " וכל הנתונים שלה");
    del.addEventListener("click", function () {
      if (listening) { return; }
      if (!armed) { armed = true; del.textContent = "בטוח? לחיצה נוספת מוחקת לתמיד"; return; }
      try { localStorage.removeItem(LS_LOG + child.id); } catch (e) { /* storage blocked */ }
      profiles = profiles.filter(function (p) { return p.id !== child.id; });
      if (me && me.id === child.id) { abandon(); dropRec(); me = null; log = []; stars = {}; verdict = null; if (source === "mine") { setSource("teacher"); } showChooser(true); }
      else if (!$("chooser").hidden) { showChooser(true); }
      saveProfiles(); repWho = null; render(); drawReport();
    });
    var drow = el("div", "row"); drow.appendChild(del); box.appendChild(drow);
  }
  $("reportBox").addEventListener("toggle", function () { if (this.open) { repWho = me ? me.id : null; drawReport(); } });

  // ---------- parent: other passages, kept on this device ----------
  function parseEditor(text) {
    return text.split(/\r?\n/)
      .map(function (l) { return l.replace(/^\s*(\d+[.)]|[-*•])\s*/, "").trim().slice(0, 300); })
      .filter(function (l) { return /[A-Za-z]/.test(l); })
      .slice(0, 100);
  }
  $("parent").addEventListener("toggle", function () {
    if ($("parent").open) { $("editor").value = isLocal ? sentences.join("\n") : ""; $("saveStatus").textContent = ""; }
    $("resetBtn").hidden = !isLocal;
  });
  $("saveBtn").addEventListener("click", function () {
    var list = parseEditor($("editor").value);
    if (!list.length) { $("saveStatus").textContent = "לא מצאתי טקסט באנגלית."; return; }
    if (listening) { return; }
    var known = {};       // passages that stay as they were keep their Hebrew line
    if (isLocal && source === "teacher") { sentences.forEach(function (s, i) { if (hasGloss(glosses[i])) { known[s] = glosses[i]; } }); }
    var gl = list.map(function (s) { return known[s] || null; });
    try { localStorage.setItem(LS_LOCAL, JSON.stringify({ sentences: list, glosses: gl, savedAt: new Date().toISOString() })); }
    catch (e) { $("saveStatus").textContent = "לא הצלחתי לשמור במכשיר הזה."; return; }
    source = "teacher"; saveSource();
    idx = 0; use(list, gl, true);
    $("resetBtn").hidden = false;
    $("saveStatus").textContent = "נשמרו " + list.length + " קטעים במכשיר הזה.";
  });
  $("resetBtn").addEventListener("click", function () {
    if (listening) { return; }
    try { localStorage.removeItem(LS_LOCAL); } catch (e) { /* storage blocked */ }
    source = "teacher"; saveSource();
    idx = 0; use(teacher.sentences, teacher.glosses, false);
    $("editor").value = ""; $("resetBtn").hidden = true;
    $("saveStatus").textContent = "חזרנו לקטעים מהמורה.";
  });

  // ---------- start ----------
  function choose() {
    var local = null;
    try { local = JSON.parse(localStorage.getItem(LS_LOCAL) || "null"); } catch (e) { /* no local set */ }
    var ok = local && Array.isArray(local.sentences) && local.sentences.length;
    // passages typed on this device win until the teacher's set is updated after them
    if (ok && (!teacher.updatedAt || String(local.savedAt || "") > teacher.updatedAt)) {
      var lg = Array.isArray(local.glosses) ? local.glosses.map(function (g) { return Array.isArray(g) ? g.map(String) : null; }) : [];
      use(local.sentences.map(String), lg, true);
    }
    else { use(teacher.sentences, teacher.glosses, false); }
  }
  try {
    showHe = localStorage.getItem(LS_GLOSS) !== "0"; $("glossToggle").checked = showHe;
    var at = parseInt(localStorage.getItem(LS_IDX), 10); if (at > 0) { idx = at; }
    var ps = JSON.parse(localStorage.getItem(LS_PROF) || "[]"), cur = localStorage.getItem(LS_CUR);
    if (Array.isArray(ps)) {
      profiles = ps.filter(function (p) { return p && typeof p.id === "string" && typeof p.name === "string"; }).slice(0, 8);
      me = profiles.filter(function (p) { return p.id === cur; })[0] || null;
      if (me) { log = readLog(me.id); }
    }
  } catch (e) { /* storage blocked */ }
  if (!me) { showChooser(true); }

  if (!SR) {
    $("envNote").textContent = "הדפדפן הזה לא יודע להקשיב לקריאה. באייפד ובאייפון צריך לפתוח את הדף ב-Safari. אפשר עדיין להשמיע את הקטעים.";
    $("envNote").hidden = false;
  } else if (window.navigator.standalone) {
    $("envNote").textContent = "כשהדף נפתח מסמל במסך הבית, ההקשבה לא תמיד עובדת. אם הכפתור לא מגיב, פתחו את הדף ב-Safari.";
    $("envNote").hidden = false;
  }
  if (hasSynth) { try { window.speechSynthesis.getVoices(); } catch (e) { /* voices load lazily */ } }
  render();

  // ---------- passages that arrive inside a link (#set=...) ----------
  // The link is made by the parent's own page. Anyone could craft one, so what it carries is
  // checked, shown as plain text only, and loaded only after someone on this device agrees.
  function readLinkSet() {
    var m = /^#set=([A-Za-z0-9_-]{8,60000})$/.exec(location.hash || "");
    if (!m) { return null; }
    try {
      var b = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) { b += "="; }
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
      var d = JSON.parse(new TextDecoder().decode(bytes));
      if (!d || !Array.isArray(d.s)) { return null; }
      var s = [], g = [];
      d.s.slice(0, 100).forEach(function (x, k) {
        var text = String(x == null ? "" : x).replace(/\s+/g, " ").trim().slice(0, 300);
        if (!/[A-Za-z]/.test(text)) { return; }
        var gl = Array.isArray(d.g) && typeof d.g[k] === "string" ? d.g[k].split("|").map(function (w) { return w.slice(0, 40); }) : null;
        s.push(text); g.push(gl && gl.length === tokens(text).length ? gl : null);
      });
      return s.length ? { s: s, g: g } : null;
    } catch (e) { return null; }
  }
  function clearHash() { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* stays in the address bar */ } }
  var incoming = readLinkSet();
  if (incoming) {
    $("importText").textContent = "בקישור שנפתח יש " + incoming.s.length + (incoming.s.length === 1 ? " קטע חדש" : " קטעים חדשים") + ". לטעון אותם למכשיר הזה? הקטע הראשון:";
    $("importFirst").textContent = incoming.s[0];
    $("importBox").hidden = false;
  } else if (/^#set=/.test(location.hash || "")) {
    showNote("הקישור שנפתח לא תקין או נחתך בדרך. בקשו קישור חדש.");
    clearHash();
  }
  $("importYes").addEventListener("click", function () {
    if (!incoming || listening) { return; }
    try { localStorage.setItem(LS_LOCAL, JSON.stringify({ sentences: incoming.s, glosses: incoming.g, savedAt: new Date().toISOString() })); }
    catch (e) { showNote("לא הצלחתי לשמור את הקטעים במכשיר הזה."); return; }
    source = "teacher"; wantSrc = "teacher"; saveSource();
    idx = 0; use(incoming.s, incoming.g, true);
    incoming = null; $("importBox").hidden = true; clearHash();
  });
  $("importNo").addEventListener("click", function () { incoming = null; $("importBox").hidden = true; clearHash(); });

  fetch("data.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && Array.isArray(d.sentences) && d.sentences.length) {
      teacher = {
        sentences: d.sentences.map(String),
        glosses: Array.isArray(d.glosses) ? d.glosses.map(function (g) { return Array.isArray(g) ? g.map(String) : null; }) : [],
        updatedAt: String(d.updatedAt || "")
      };
    }
    if (source === "teacher") { choose(); }
  }, function () {
    if (source === "teacher") { choose(); }
    if (!sentences.length) { showNote("לא הצלחתי לטעון את הקטעים. בדקו את החיבור לאינטרנט ורעננו את הדף."); }
  });
  try { wantSrc = localStorage.getItem(LS_SRC) || "teacher"; } catch (e) { /* storage blocked */ }
  fetch("bank.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (b) {
    if (!b || !Array.isArray(b.levels) || !b.sounds) { return; }
    b.levels = b.levels.filter(function (L) { return L && L.n && Array.isArray(L.passages) && L.passages.length; });
    if (!b.levels.length) { return; }
    bank = b;
    if (wantSrc !== "teacher" && !listening && !attempt) { setSource(wantSrc, true); } else { render(); }
  }, function () { /* no bank: only the teacher's passages */ });
})();
</script>
</body>
</html>
